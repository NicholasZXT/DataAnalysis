[build-system]
# 使用传统的 setuptools 构建，建议使用较新版本的 setuptools 以支持 pyproject.toml 和 wheel
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
# 使用 Pixi 或 UV
#requires = ["hatchling"]
#build-backend = "hatchling.build"
# 使用 Poetry
#requires = ["poetry-core>=2.0.0,<3.0.0"]
#build-backend = "poetry.core.masonry.api"

# ------------------------------------ Project 配置 ------------------------------------
[project]
name = "Data-Analysis-Project"
version = "1.0.0"
description = ""
authors = [
    {name = "Nicholas", email = "nicho@email.com"}
]
#readme = "README.md"

# 指定 Python 版本，对 Poetry, Pixi, UV 都生效
#requires-python = ">=3.10,<4.0"
requires-python = "==3.10.*"

# 使用 dynamic 配置动态从 tool.poetry 获取依赖
#dynamic = ["dependencies"]
# 项目依赖，在 pyproject.toml 的规范里，这里配置的依赖在打wheel包时会被一起上传到 PyPI 中
# 此处的依赖配置，可以被 Poetry, Pixi, UV 识别并生效
dependencies = [
    # build-system 的依赖不需要出现在这里
    #    "setuptools",
    #    "wheel",
    #    "hatchling",
    "pip",
    "ipykernel>=6.29.5",
    "ipython >= 8.30.0",
    "notebook >= 7.0.0",
    "jupyterlab >=4.0.0",
    "pandas-stubs~=2.2.3",
]

# 可选依赖，此处的依赖可以通过 pip install package[opt_name] 选择安装
# Poetry 会忽略此处依赖定义；Pixi 会将此处依赖识别成 pypy-dependencies 的 feature；UV 会识别此处依赖定义为可选依赖
[project.optional-dependencies]

# 分组依赖，此处的依赖处理方式视第三方工具而定，pyproject.toml 虽然提供了此定义，但并未提供标准处理方法
# Poetry 会忽略此处依赖定义；Pixi 会将此处依赖识别成 pypy-dependencies 的 feature；UV 会将此处的依赖识别成对应 group
[dependency-groups]
# 以下的配置主要是给 UV 使用，因此分组前加上了一个 uv_ 前缀，否则会和下面 Pixi 的 feature 命名冲突，导致Pixi解析有问题
uv_db = [
	"python-dotenv",
	"pydantic >=2.0.0",
	"pydantic-settings >=2.0.0",
	"pymysql",
	"sqlalchemy >=1.4",
	"requests",
	"httpx",
	"elasticsearch >=7.13.0",
	"pyhive >=0.6.5",
	# pyhive 依赖下面的 thrift
	"thrift >= 0.20.0",
    "thrift_sasl >= 0.4.3",
#    "thriftpy2 >= 0.5.0",
	 "neo4j >=5.5.0,<6.0.0",
	# "neo4j-python-driver >=5.5.0",
	# "py2neo >=2021.2.3",
#	"kafka-python >=2.0.0",
	# "redis >=3.5.0",
	# "happybase >=1.2.0",
]
uv_ml = [
	"openpyxl >=3.0.0",
	"numpy >=1.20.0",
	"pandas >=1.4.0",
	"scikit-learn >=1.0.0",
	"scipy",
	"statsmodels",
	"dataclasses",
	"xgboost >=2.0.0",
	"lightgbm >=4.0.0",
	"optuna >=3.1.0",
	"optuna-dashboard >=0.10.0",
	"hyperopt ==0.2.7",
]
uv_jupyter = [
#    "jupyter",
    "ipykernel>=6.29.5",
    "ipython >= 8.30.0",
    "notebook >= 7.0.0",
    "jupyterlab >=4.0.0",
    # notebook 6.x 最后一个版本，对应 jupyterlab 3.6.8
#    "notebook <= 6.5.7",
#    "jupyterlab >=3.4.0,<=3.6.8",
    "nbconvert",
	"ipywidgets >=8.0.0",
]
uv_graph = [
	"matplotlib >=3.5.0",
	"seaborn",
	"plotly >=5.10.0",
	"dash",
]
#uv_torch_13 = [
#	# 1.x 最后一个PyTorch版本，CUDA最高支持到 11.7，Python版本为3.10
#    "torch == 1.13.1",
#	"torchvision == 0.14.1",
#	"torchaudio == 0.13.1",
#]
uv_torch_2x = [
    # 2.x 版本PyTorch，这里选择 2.8 + CUDA 12.8
    "torch == 2.8.0",
	"torchvision == 0.23.0",
	"torchaudio == 2.8.0",
]
uv_nlp = [
	# "nltk",
    "gensim",
	"spacy >= 3.4.2 ",
	"transformers >= 4.23.1",
	"tokenizers",
	"sentence-transformers <= 5.2.0",
]

# --- langchain v0.3.x 版本 ---
#uv_llm = [
#	"openai >=1.0.0",
##	"langchain-core <= 0.3.79",  # 无需显式指定版本
#	"langchain ==0.3.27",  # v0.3.x 最后一个版本
#	"langchain-community >=0.3.21, <=0.4.1",
#	"langgraph >=0.4.7, <= 0.6.11",
#	"langchain-openai >=0.3.12, <=0.3.35",
#	"langchain-ollama >=0.3.3, <= 0.3.10",
#	"mcp[cli] >= 1.12.0",
#    "fastmcp >= 2.10.0"
#]
# --- langchain v1.0.x 版本，发布于 2025-10-18 ---
uv_llm = [
	"openai >= 1.0.0",
#	"langchain-core",  # 无需显式指定版本
	"langchain-classic >= 1.0.0",  # 为了兼容 v0.3 代码，v1.0.0 提供了一个兼容模块
	"langchain >=1.0.0",
	"langchain-community >= 0.4.1",
	"langgraph >= 1.0.0",
	"langchain-openai >= 1.0.0",
	"langchain-ollama >= 1.0.0",
	"langchain-mcp-adapters >= 0.1.10",
	"langchain-elasticsearch >= 1.0.0",
	"mcp[cli] >= 1.12.0",
    "fastmcp >= 2.10.0"
]
uv_rag = [
    # llama-index 只是一个starter，包含了 llama-index-core + 插件package
#	"llama-index >= 0.14.0",
    # core 才是核心
	"llama-index-core >= 0.14.0",
#	"llama-index-cli",
    # 以下都是扩展package，参见 https://llamahub.ai/
	"llama-index-llms-openai",
	"llama-index-embeddings-openai",
	"llama-index-llms-ollama",
	"llama-index-embeddings-ollama",
    "llama-index-embeddings-huggingface",
	"llama-index-readers-file",
	"llama-index-vector-stores-chroma",
#	"llama-index-vector-stores-elasticsearch",
#	"llama-index-vector-stores-milvus",
#	"llama-index-vector-stores-neo4jvector",
    # ------ 其他文件处理package ------
    "python-docx",
    "pymupdf",
    "pymupdf4llm",
#    "markitdown[all]",
    "markitdown[pdf, docx, pptx, xlsx, xls]",
    "chromadb",
]

# ------------------------------------ UV 配置 ------------------------------------
# 使用方式1： uv sync
# 使用方式2： uv export --format pylock.toml -o pylock.toml  &&  uv pip sync pylock.toml
[tool.uv]
managed = true
package = false
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
python-downloads = "manual"
#python-preference = "system"
python-preference = "managed"
link-mode = "copy"

default-groups = [
    "uv_db", "uv_ml", "uv_graph", "uv_jupyter",
#    "uv_torch_13",
    "uv_torch_2x",
    "uv_nlp", "uv_llm", "uv_rag"
]

#[tool.uv.dependency-groups]
## pytorch 1.13 版本只能使用 3.10 版本
#uv_torch_13 = {requires-python = "==3.10.*"}
## pytorch 2.8 版本只能使用 3.10 版本及其以上
#uv_torch_2x = {requires-python = ">=3.10"}

[tool.uv.sources]
# 为pytorch包指定单独的仓库索引
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
#  { index = "pytorch-cuda117", marker = "sys_platform == 'windows'" },
  { index = "pytorch-cuda128", marker = "sys_platform == 'windows'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
#  { index = "pytorch-cuda117", marker = "sys_platform == 'windows'" },
  { index = "pytorch-cuda128", marker = "sys_platform == 'windows'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
#  { index = "pytorch-cuda117", marker = "sys_platform == 'windows'" },
  { index = "pytorch-cuda128", marker = "sys_platform == 'windows'" },
]

# PyTorch 仓库index配置
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[[tool.uv.index]]
name = "pytorch-cuda117"
url = "https://download.pytorch.org/whl/cu117"
explicit = true
[[tool.uv.index]]
name = "pytorch-cuda118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
[[tool.uv.index]]
name = "pytorch-cuda121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
[[tool.uv.index]]
name = "pytorch-cuda124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
[[tool.uv.index]]
name = "pytorch-cuda126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
[[tool.uv.index]]
name = "pytorch-cuda128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# 适用于 uv pip 系列命令的配置
[tool.uv.pip]
system = false
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
extra-index-url = [
	"https://download.pytorch.org/whl/cpu",
	"https://download.pytorch.org/whl/cu117",
	"https://download.pytorch.org/whl/cu128"
]
all-extras = true
# 此处的 group 配置对于 uv pip sync 命令不生效
group = [
    "uv_db", "uv_ml", "uv_graph", "uv_jupyter",
#    "uv_torch_13",
    "uv_torch_2x",
    "uv_nlp", "uv_llm", "uv_rag"
]
# PyTorch index 设置
torch-backend = "auto"
#torch-backend = "cpu"
#torch-backend = "cu117"
#torch-backend = "cu118"
#torch-backend = "cu124"
#torch-backend = "cu128"



# ------------------------------------ Pixi 配置 ------------------------------------
[tool.pixi.workspace]
#platforms = ["win-64", "linux-64", "osx-64"]
platforms = ["win-64"]
channels = ["conda-forge", "nvidia", "pytorch"]   # nvidia channel需要在 pytorch channel 前面

# 下面这个配置不建议，不过不设置的话，pytorch-cuda==11.7 就无法安装 —— 只限于 win-64 平台时似乎不需要此配置？？？
channel-priority = "disabled"

[tool.pixi.pypi-options]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.pixi.dependencies]
#python = "3.10.*"
psutil = ">=5.9.0"

[tool.pixi.feature.db.dependencies]
python-dotenv = "*"
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
pymysql =  "*"
sqlalchemy = ">=1.4"
elasticsearch = ">=7.13.0"
requests = "*"
httpx = "*"
pyhive = ">=0.6.5"
thrift = ">= 0.20.0"
thrift_sasl = ">= 0.4.3"
kafka-python = ">=2.0.0"
#happybase = ">=1.2.0"
#neo4j-python-driver = ">=5.5.0"
#py2neo = ">=2021.2.3"
#redis = ">=3.5.0"  # 不适用于 osx-64

[tool.pixi.feature.ml.dependencies]
openpyxl = ">=3.0.0"
numpy = ">=1.20.0"
pandas = ">=1.4.0"
scikit-learn = ">=1.0.0"
scipy = "*"
dataclasses = "*"
ipython = "*"
ipykernel = "*"
ipywidgets = ">=8.0.0"
jupyterlab = ">=3.4.0"
xgboost = ">=2.0.0"
lightgbm = ">=4.0.0"
optuna = ">=3.1.0"
optuna-dashboard = ">=0.10.0"
hyperopt = "==0.2.7"

[tool.pixi.feature.graph.dependencies]
matplotlib = ">=3.5.0"
seaborn = "*"
plotly = ">=5.10.0"
dash = "*"

[tool.pixi.feature.dl.dependencies]
# 1.x 最后一个PyTorch版本，CUDA最高支持到 11.7
pytorch = { version = "==1.13.1", channel = "pytorch" }
pytorch-cuda = { version = "==11.7", channel = "pytorch" }   # 只有 conda 源才需要 pytorch-cuda，PyPI没有
torchvision = { version = "==0.14.1", channel = "pytorch" }
torchaudio = { version = "==0.13.1", channel = "pytorch"}
# 2.5 版本
#pytorch = "==2.5.1"
#pytorch-cuda = "==12.4"
#torchvision = "==0.20.1"
#torchaudio = "==2.5.1"

#[tool.pixi.feature.dl.pypi-dependencies]
#torchserve = ">=0.7.0"

[tool.pixi.feature.nlp.dependencies]
#nltk = "*"
spacy = ">=3.4.2"
transformers = ">=4.23.1"
tokenizers = "*"

[tool.pixi.feature.llm.dependencies]
openai = ">=1.0.0"
langchain-core = ">=0.3.51"
langchain = ">=0.3.23"
langchain-community = ">=0.3.21"
langgraph = ">=0.3.30"
langchain-openai = ">=0.3.12"

[tool.pixi.feature.llm.pypi-dependencies]
# conda源里暂时没有
langchain-ollama = ">=0.3.3"

[tool.pixi.feature.local.dependencies]
pixi-pycharm = "*"

# ------ Pixi环境定义 ------
[tool.pixi.environments]
default = { features = ["db", "ml", "graph", "dl", "nlp", "llm", "local"], solve-group = "main" }
prod = { features = ["db", "ml", "graph", "dl", "nlp", "llm"], solve-group = "main" }



# ------------------------------------ Poetry 配置 ------------------------------------
# 安装命令
# poetry install --all-groups
# poetry install --only dl
[tool.poetry]
package-mode = false
# 配置 清华源 为主要的 PyPI 源
[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

# 配置 PyTorch 的源
[[tool.poetry.source]]
name = "pytorch-cuda117"
url = "https://download.pytorch.org/whl/cu117"
priority = "explicit"
[[tool.poetry.source]]
name = "pytorch-cuda124"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"

[tool.poetry.group.base.dependencies]
psutil = ">=5.9.0"

[tool.poetry.group.db.dependencies]
python-dotenv = "*"
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
pymysql =  "*"
sqlalchemy = ">=1.4"
elasticsearch = ">=7.13.0"
requests = "*"
httpx = "*"
pyhive = ">=0.6.5"
thrift = ">= 0.20.0"
thrift_sasl = ">= 0.4.3"
kafka-python = ">=2.0.0"
#happybase = ">=1.2.0"
#neo4j-python-driver = ">=5.5.0"
#py2neo = ">=2021.2.3"
#redis = ">=3.5.0"  # 不适用于 osx-64

[tool.poetry.group.ml.dependencies]
openpyxl = ">=3.0.0"
numpy = ">=1.20.0"
pandas = ">=1.4.0"
scikit-learn = ">=1.0.0"
scipy = "*"
dataclasses = "*"
ipython = "*"
ipykernel = "*"
ipywidgets = ">=8.0.0"
jupyterlab = ">=3.4.0"
xgboost = ">=2.0.0"
lightgbm = ">=4.0.0"
optuna = ">=3.1.0"
optuna-dashboard = ">=0.10.0"
hyperopt = "==0.2.7"

[tool.poetry.group.graph.dependencies]
matplotlib = ">=3.5.0"
seaborn = "*"
plotly = ">=5.10.0"
dash = "*"

[tool.poetry.group.dl.dependencies]
# 1.x 最后一个PyTorch版本，CUDA最高支持到 11.7
# pip install torch==1.13.1+cu117 torchvision==0.14.1+cu117 torchaudio==0.13.1 --extra-index-url https://download.pytorch.org/whl/cu117
torch = {version = "1.13.1+cu117", source = "pytorch-cuda117"}
